<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Petlune — Privacy policy</title><style>body{margin:0;background:#0b1221;color:#f3f6ff;font:16px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 22px 90px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.2}h2{margin-top:34px}p{color:#c8d2e5}a{color:#b5c0ff}.languages{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.languages button{background:#192640;color:#e4eaff;border:1px solid #425273;border-radius:9px;padding:8px 13px;cursor:pointer}.languages button[aria-pressed=true]{background:#8f98fa;color:#0a1020}.notice{border:1px solid #8b784c;border-radius:10px;padding:13px;background:#30281a}section{border-top:1px solid #26354c;margin-top:26px}</style></head><body><main><a href="../">← Tivaroid Studio</a><h1>Petlune</h1><nav class="languages" id="languages" aria-label="Policy language"></nav><article id="policy"></article></main><script>
const translations={"en":["Privacy policy","Data processed","Storage and sharing","Permissions and services","Retention and deletion","Contact","This policy describes how the app handles information. Review the permissions and services listed below.","You can remove locally stored information by clearing the app data or uninstalling it. Files you export remain under your control."]};
const facts={"name":"Petlune","data":"Pet names, profiles, photos, medication schedules, care history, vaccinations, vet visits, weight records, expenses and locally stored documents. Some notes or documents may contain personal information. Local household membership and activity records support planned shared care.","services":"Notification and exact-alarm permissions support medication and care reminders. Android FileProvider supports explicit private document sharing. Cloud synchronization and production account access are not confirmed in the current implementation; do not assume that they are active.","review":true};
const nav=document.getElementById("languages"),root=document.getElementById("policy");
function render(lang){const t=translations[lang]||translations.en;document.documentElement.lang=lang;nav.replaceChildren();for(const l of Object.keys(translations)){const b=document.createElement("button");b.textContent=l.toUpperCase();b.setAttribute("aria-pressed",String(l===lang));b.onclick=()=>{history.replaceState(null,"","#"+l);render(l)};nav.append(b)}
root.replaceChildren();const h=document.createElement("h2");h.textContent=t[0];root.append(h);
const p=document.createElement("p");p.textContent=t[6];root.append(p);
if(facts.review){const n=document.createElement("p");n.className="notice";n.textContent="Pre-release policy draft: verify data flows, SDKs and permissions against the production build before using this policy in Google Play.";root.append(n)}
const items=[[t[1],facts.data],[t[2],"Core information is intended to remain on the device unless you explicitly share or export it. Check the final release for any enabled remote synchronization or third-party transfers."],[t[3],facts.services],[t[4],t[7]],[t[5],"Tivaroid Studio — tivaroid.studio@gmail.com. You may contact us about access, correction or deletion of personal information."]];
for(const [heading,body] of items){const s=document.createElement("section"),h2=document.createElement("h2"),txt=document.createElement("p");h2.textContent=heading;txt.textContent=body;s.append(h2,txt);root.append(s)}
if(lang!=="en"){const n=document.createElement("p");n.className="notice";n.textContent="Technical data-practice details are currently provided in English to avoid inaccuracies. This localized page is a translation of headings and general privacy information; consult English for the complete description.";root.append(n)}}
render(translations[location.hash.slice(1)]?location.hash.slice(1):"en");
</script></body></html>
